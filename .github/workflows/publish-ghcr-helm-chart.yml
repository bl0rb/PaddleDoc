name: Publish GHCR Helm Chart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Chart/app version to publish (for example 0.2.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  CHART_PATH: charts/paddledoc
  OCI_REPO: ghcr.io/bl0rb/charts

permissions:
  contents: read
  packages: write

jobs:
  publish-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set chart version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        shell: bash
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz -o helm.tgz
          tar -xzf helm.tgz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Log in to GHCR for Helm OCI
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        id: package
        shell: bash
        run: |
          PACKAGE_OUTPUT=$(helm package "${{ env.CHART_PATH }}" \
            --version "${{ steps.version.outputs.value }}" \
            --app-version "${{ steps.version.outputs.value }}")
          echo "$PACKAGE_OUTPUT"
          PACKAGE_FILE=$(echo "$PACKAGE_OUTPUT" | sed -n 's/^Successfully packaged chart and saved it to: //p' | xargs -n1 basename)
          echo "file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR OCI
        shell: bash
        run: |
          helm push "${{ steps.package.outputs.file }}" "oci://${{ env.OCI_REPO }}"
