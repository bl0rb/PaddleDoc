nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

global:
  podAnnotations: {}
  podLabels: {}

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/bl0rb/paddledoc-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  apiUrl: http://localhost:8000
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/bl0rb/paddledoc-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  corsOrigins: '["http://localhost:3000"]'
  runAlembicOnStartup: true
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

worker:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/bl0rb/paddledoc-worker
    tag: "latest"
    pullPolicy: IfNotPresent
  paddleDefaultProfile: ppocrv6_tiny
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # PaddleOCR downloads models at runtime into $HOME/.paddlex and
  # $HOME/.paddleocr. Since the container runs as a non-root, non-writable
  # image user, an emptyDir is mounted as $HOME so model downloads succeed.
  modelCache:
    enabled: true
    # Maximum size of the emptyDir model cache (e.g. "10Gi"). Empty string
    # means unlimited (no sizeLimit is rendered on the emptyDir).
    sizeLimit: ""

migrationJob:
  enabled: false
  backoffLimit: 2
  # Defaults mirror backend.podSecurityContext/containerSecurityContext since
  # this job runs the backend image.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  size: 20Gi
  existingClaim: ""

database:
  type: postgresdb
  useExternal: true
  host: ""
  port: 5432
  database: paddledoc
  schema: public
  user: paddledoc
  passwordSecret:
    name: ""
    key: password

redis:
  enabled: true
  image:
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent
  host: ""
  port: 6379
  resources: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

autoscaling:
  backend:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  worker:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

ingress:
  frontend:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: paddledoc.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  backend:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: api.paddledoc.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
