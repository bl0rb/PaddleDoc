{{- if and .Values.worker.enabled .Values.worker.modelCache.enabled .Values.worker.modelCache.persistence.enabled (not .Values.worker.modelCache.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "paddledoc.fullname" . }}-worker-model-cache
  labels:
    {{- include "paddledoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  accessModes:
    {{- toYaml .Values.worker.modelCache.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.worker.modelCache.persistence.size }}
  {{- if .Values.worker.modelCache.persistence.storageClassName }}
  storageClassName: {{ .Values.worker.modelCache.persistence.storageClassName }}
  {{- end }}
{{- end }}
