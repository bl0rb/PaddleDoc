{{- if .Values.backend.enabled }}
{{- if not .Values.database.useExternal }}
{{- fail "database.useExternal must be true. This chart supports only external PostgreSQL." }}
{{- end }}
{{- include "paddledoc.requireSecretKey" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paddledoc.fullname" . }}-backend
  labels:
    {{- include "paddledoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ ternary .Values.autoscaling.backend.minReplicas .Values.backend.replicaCount .Values.autoscaling.backend.enabled }}
  selector:
    matchLabels:
      {{- include "paddledoc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "paddledoc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.global.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "paddledoc.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.passwordSecret.name is required" .Values.database.passwordSecret.name }}
                  key: {{ required "database.passwordSecret.key is required" .Values.database.passwordSecret.key }}
            - name: DATABASE_URL
              value: postgresql+psycopg://{{ required "database.user is required" .Values.database.user }}:$(DATABASE_PASSWORD)@{{ required "database.host is required" .Values.database.host }}:{{ .Values.database.port }}/{{ required "database.database is required" .Values.database.database }}
            - name: DATABASE_SCHEMA
              value: {{ .Values.database.schema | quote }}
            {{- if include "paddledoc.redisAuthEffective" . }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "paddledoc.redisAuthSecretName" . }}
                  key: {{ include "paddledoc.redisAuthSecretKey" . }}
            {{- end }}
            - name: REDIS_URL
              value: {{ include "paddledoc.redisUrl" . | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.backend.corsOrigins | quote }}
            - name: TRUSTED_PROXY_IPS
              value: {{ .Values.backend.trustedProxyIps | quote }}
            - name: TRUSTED_PROXY_HOPS
              value: {{ .Values.backend.trustedProxyHops | quote }}
            {{- if include "paddledoc.secretKeyEffective" . }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "paddledoc.secretKeySecretName" . }}
                  key: {{ include "paddledoc.secretKeySecretKey" . }}
            {{- end }}
            - name: PUBLIC_API_URL
              value: {{ include "paddledoc.publicApiUrl" . | quote }}
            - name: RUN_ALEMBIC_ON_STARTUP
              value: {{ .Values.backend.runAlembicOnStartup | quote }}
            {{- if .Values.backend.maxUploadBytes }}
            - name: MAX_UPLOAD_BYTES
              value: {{ .Values.backend.maxUploadBytes | quote }}
            {{- end }}
            - name: IMPORT_ENABLED
              value: {{ .Values.importer.enabled | quote }}
            - name: IMPORT_PRIVATE_HOST_ALLOWLIST
              value: {{ .Values.importer.privateHostAllowlist | toJson | quote }}
            # int64: Helm parses large YAML numbers as float64 and | quote
            # would render 20971520 as "2.097152e+07", which the app's int
            # settings reject.
            - name: IMPORT_MAX_PAGES
              value: {{ .Values.importer.maxPages | int64 | quote }}
            - name: IMPORT_ATTACHMENT_MAX_BYTES
              value: {{ .Values.importer.attachmentMaxBytes | int64 | quote }}
            - name: IMPORT_RUN_MAX_TOTAL_BYTES
              value: {{ .Values.importer.runMaxTotalBytes | int64 | quote }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: shared-storage
              mountPath: /app/backend/storage
      volumes:
        # Always mount shared-storage: the backend runs as non-root and cannot
        # create /app/backend/storage inside the root-owned image filesystem.
        - name: shared-storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-storage" (include "paddledoc.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
