{{/*
Only created when we own/manage SECRET_KEY (auth.secretKey.existingSecret is
empty) and a plaintext value was actually provided -- if the operator points
auth.secretKey.existingSecret at their own secret, that secret is expected to
already exist and this chart never manages it. Unlike redis.auth.password,
SECRET_KEY is never auto-generated when left unset: see
auth.required/paddledoc.requireSecretKey in _helpers.tpl, which instead fails
template rendering with a clear message.
*/}}
{{- if and (not .Values.auth.secretKey.existingSecret) .Values.auth.secretKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paddledoc.fullname" . }}-auth
  labels:
    {{- include "paddledoc.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ .Values.auth.secretKey.value | b64enc }}
{{- end }}
